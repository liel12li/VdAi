[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vdai"
version = "0.2.0"
description = "AI promotional Reels generator from an Instagram business page"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
    "moviepy>=2.1.2",
    "imageio-ffmpeg>=0.5",
    "Pillow>=10.0",
    "numpy>=1.26",
    "python-bidi>=0.6",
    "instaloader>=4.14",
    "requests>=2.31",
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
vdai = "vdai.cli:main"

[project.gui-scripts]
vdai-app = "vdai.desktop:launch"

[tool.setuptools.packages.find]
include = ["vdai*"]

[tool.setuptools.package-data]
vdai = ["web/static/*"]
